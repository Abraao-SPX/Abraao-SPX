name: Atualizar perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    name: Gerar painel de estatisticas
    runs-on: ubuntu-latest
    steps:
      - name: Gerar metricas do perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Abraao-SPX
          template: classic
          filename: github-metrics.svg
          config_timezone: America/Maceio
          config_display: large
          config_octicon: true
          config_twemoji: true
          base: header, activity, community, repositories, metadata
          plugin_languages: true
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_isocalendar: true
          plugin_isocalendar_duration: half-year

  snake:
    name: Gerar animacao de contribuicoes
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVGs da snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Abraao-SPX
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7c3aed

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
