name: Atualizar perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  profile-assets:
    name: Gerar visuais personalizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar painel e constelacao
        run: node .github/scripts/generate-profile-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar atualizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/github-contributions.svg
          git diff --staged --quiet || git commit -m "chore: atualizar visuais do perfil"
          git push
