<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title description">
    <title id="title">Painel GitHub de Abraão Paixão</title>
    <desc id="description">Resumo de contribuições, sequência atual, repositórios e linguagens mais utilizadas.</desc>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .heading{fill:#f0f6fc;font-size:16px;font-weight:600}
      .username{fill:#8b949e;font-size:12px}
      .metric{fill:#a78bfa;font-size:25px;font-weight:650}
      .label{fill:#8b949e;font-size:10px}
      .section{fill:#c9d1d9;font-size:12px;font-weight:600}
      .language{fill:#c9d1d9;font-size:10px}
      .percentage{fill:#6e7681;font-size:9px}
    </style>
    <rect x=".5" y=".5" width="899" height="229" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="35" class="heading">Abraão no GitHub</text>
    <text x="872" y="35" text-anchor="end" class="username">@Abraao-SPX</text>
    <line x1="28" y1="52" x2="872" y2="52" stroke="#21262d"/>
    
        <g transform="translate(55 74)">
          <text y="27" class="metric">583</text>
          <text y="48" class="label">Contribuições · 12 meses</text>
        </g>
        <g transform="translate(350 74)"><line x1="-35" y1="0" x2="-35" y2="54" stroke="#30363d"/>
          <text y="27" class="metric">0 dias</text>
          <text y="48" class="label">Sequência atual</text>
        </g>
        <g transform="translate(645 74)"><line x1="-35" y1="0" x2="-35" y2="54" stroke="#30363d"/>
          <text y="27" class="metric">14</text>
          <text y="48" class="label">Repositórios públicos</text>
        </g>
    <text x="28" y="151" class="section">Linguagens mais usadas</text>
    <rect x="28" y="169" width="844" height="7" fill="#21262d"/>
    <rect x="28.0" y="169" width="333.2" height="7" fill="#f7df1e"/><rect x="362.2" y="169" width="183.9" height="7" fill="#3178c6"/><rect x="547.1" y="169" width="88.8" height="7" fill="#e34f26"/><rect x="636.8" y="169" width="88.4" height="7" fill="#3776ab"/><rect x="726.3" y="169" width="145.7" height="7" fill="#475569"/>
    
        <g transform="translate(28.0 202)">
          <circle cx="4" cy="-3" r="3.5" fill="#f7df1e"/>
          <text x="14" class="language">JavaScript</text>
          <text x="14" y="15" class="percentage">39,5%</text>
        </g>
        <g transform="translate(196.8 202)">
          <circle cx="4" cy="-3" r="3.5" fill="#3178c6"/>
          <text x="14" class="language">TypeScript</text>
          <text x="14" y="15" class="percentage">21,8%</text>
        </g>
        <g transform="translate(365.6 202)">
          <circle cx="4" cy="-3" r="3.5" fill="#e34f26"/>
          <text x="14" class="language">HTML</text>
          <text x="14" y="15" class="percentage">10,5%</text>
        </g>
        <g transform="translate(534.4 202)">
          <circle cx="4" cy="-3" r="3.5" fill="#3776ab"/>
          <text x="14" class="language">Python</text>
          <text x="14" y="15" class="percentage">10,5%</text>
        </g>
        <g transform="translate(703.2 202)">
          <circle cx="4" cy="-3" r="3.5" fill="#475569"/>
          <text x="14" class="language">Outras</text>
          <text x="14" y="15" class="percentage">17,7%</text>
        </g>
  </svg>